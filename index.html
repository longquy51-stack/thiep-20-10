<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; position: relative;
        }
        .floating-heart {
            position: absolute; color: rgba(255, 255, 255, 0.6); pointer-events: none;
            animation: flyUp 6s linear infinite; z-index: 1;
        }
        @keyframes flyUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.5); opacity: 0; }
        }
        .floating-img {
            position: absolute; width: 85px; height: 85px; object-fit: cover;
            border-radius: 12px; border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); pointer-events: none; z-index: 1;
            opacity: 0; display: none;
        }
        @keyframes imgFly {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateY(50vh) rotate(15deg); }
            90% { opacity: 1; }
            100% { transform: translateY(-15vh) rotate(-15deg); opacity: 0; }
        }
        .welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .open-btn {
            background: #fff; color: #ff3366; border: none; padding: 15px 40px;
            font-size: 1.3rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: bounce 2s infinite;
            display: flex; align-items: center; gap: 10px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        /* KHUNG CHỮ XUYÊN THẤU 100% - KHÔNG CHE NỀN */
        .card {
            background: rgba(255, 255, 255, 0.02); /* Gần như trong suốt hoàn toàn */
            backdrop-filter: none; /* Bỏ hẳn hiệu ứng blur gây che khuất nền phía sau */
            -webkit-backdrop-filter: none;
            border: 2px solid rgba(255, 255, 255, 0.4); /* Giữ đường viền mảnh lung linh */
            padding: 40px 30px; border-radius: 24px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 90%; width: 420px;
            color: #fff; z-index: 10; display: none;
        }
        
        .card.show { display: block; opacity: 1; transform: scale(1); animation: cardIn 0.8s ease-out; }
        @keyframes cardIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        h1 { font-size: 2.3rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.4); font-weight: 800; }
        p { font-size: 1.15rem; line-height: 1.8; text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.4); font-weight: 500; min-height: 120px; }
        .cursor { display: inline-block; width: 3px; background-color: #fff; margin-left: 4px; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { background-color: transparent; } }
        .heart { font-size: 3rem; color: #ff3366; margin-top: 20px; animation: beat 0.8s infinite alternate; text-shadow: 0 0 10px rgba(255, 51, 102, 0.8); opacity: 0; transition: opacity 1s ease; }
        .heart.show-heart { opacity: 1; }
        @keyframes beat { to { transform: scale(1.2); } }
        .music-btn {
            position: fixed; top: 20px; right: 20px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.3); border: 2px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            z-index: 99; font-size: 1.3rem; animation: rotate 4s linear infinite; display: none;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .music-btn.paused { animation-play-state: paused; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <h2 style="color: #fff; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 0 2px 5px rgba(0,0,0,0.2); text-align: center; padding: 0 10px;">CK Bạn Yêu Bạn Đến Khi Nào...🎁</h2>
        <button class="open-btn" onclick="openCard()">Mở Thiệp Ra Xem Nhé 💌</button>
    </div>
    <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>
    <audio id="bgMusic" loop preload="auto"><source src="nhac.mp3" type="audio/mpeg"></audio>

    <img src="anh1.jpg" class="floating-img" id="img1" style="left: 5%; animation: imgFly 7s linear infinite 0s;">
    <img src="anh2.jpg" class="floating-img" id="img2" style="left: 15%; animation: imgFly 8s linear infinite 2s;">
    <img src="anh3.jpg" class="floating-img" id="img3" style="left: 8%; animation: imgFly 6s linear infinite 4.5s;">
    <img src="anh4.jpg" class="floating-img" id="img4" style="right: 5%; animation: imgFly 7.5s linear infinite 0.5s;">
    <img src="anh5.jpg" class="floating-img" id="img5" style="right: 16%; animation: imgFly 6.5s linear infinite 3s;">
    <img src="anh6.jpg" class="floating-img" id="img6" style="right: 9%; animation: imgFly 8.2s linear infinite 5s;">

    <div class="card" id="mainCard">
        <h1>Happy 20/10! ✨</h1>
        <p><span id="typingText"></span><span class="cursor" id="textCursor"></span></p>
        <div class="heart" id="heartIcon">❤️</div>
    </div>
    <script>
        const colors = ['rgba(255,255,255,0.6)', 'rgba(255,182,193,0.7)', 'rgba(255,105,180,0.6)'];
        for (let i = 0; i < 20; i++) {
            let heart = document.createElement('div');
            heart.classList.add('floating-heart'); heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw'; heart.style.fontSize = Math.random() * 12 + 15 + 'px'; 
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.animationDelay = Math.random() * 6 + 's'; heart.style.animationDuration = Math.random() * 4 + 4 + 's';
            document.body.appendChild(heart);
        }
        const music = document.getElementById('bgMusic');
        const welcome = document.getElementById('welcomeScreen');
        const card = document.getElementById('mainCard');
        const btn = document.getElementById('musicBtn');
        const heart = document.getElementById('heartIcon');
        
        // Bạn có thể viết lại chính xác câu chúc dài của mình vào đây thay cho câu mẫu này nhé
        const loiChucText = "Chúc người phụ nữ tuyệt vời đang quét mã này luôn luôn rạng rỡ, hạnh phúc, xinh đẹp tựa như những đóa hoa hướng dương rực rỡ nhất dưới ánh mặt trời! Chúc tình yêu 💖 một ngày 20/10 thật trọn vẹn và ý nghĩa nhé! Yêu em , Thương em ==> 2 công chúa💖 Công chúa lớn và công chúa nhỏ của Anh==> mãi mãi và mãi mãi💖 💖 💖";
        
        let index = 0;
        function openCard() {
            music.play().then(() => { btn.style.display = 'flex'; }).catch(e => console.log(e));
            welcome.style.opacity = '0'; welcome.style.transform = 'scale(1.1)';
            document.querySelectorAll('.floating-img').forEach(img => img.style.display = 'block');
            setTimeout(() => { welcome.style.display = 'none'; card.classList.add('show'); typeWriter(); }, 800);
        }
        function typeWriter() {
            if (index < loiChucText.length) {
                document.getElementById("typingText").innerHTML += loiChucText.charAt(index);
                index++; setTimeout(typeWriter, 45); 
            } else { document.getElementById("textCursor").style.display = 'none'; heart.classList.add('show-heart'); }
        }
        function toggleMusic() {
            if (music.paused) { music.play(); btn.classList.remove('paused'); btn.innerText = "🎵"; }
            else { music.pause(); btn.classList.add('paused'); btn.innerText = "🔇"; }
        }
    </script>
</body>
</html>
